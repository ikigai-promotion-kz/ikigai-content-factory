<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  /*
    Оверлей монтажного слоя. Рисуется поверх уже смонтированной базы, поэтому знает
    её геометрию: BOX — координаты бокса спикера из base.mjs, рамка обязана лечь ровно.

    Safe-zone. Числа не из документации площадок, а из боевой публикации 30.07.2026:
    ролик выложили в Reels и посмотрели на телефоне. Оказалось хуже, чем считали.

      сверху  ~200 px — шапка «Reels / Друзья» и статус-бар;
      снизу   ~430 px — ник, подпись, прогресс-бар (было 250 — субтитр попадал
                        ровно на строку с ником, читалось как каша);
      справа  ~150 px — колонка кнопок: лайк, комментарий, репост, «ещё».
                        Раньше правая граница была 60 px, и кнопки ложились
                        поверх титров-карточек. Это видно на трёх кадрах из шести.

    Ничего смыслового за эти границы не выносим. Фон и лицо — можно, текст — нет.
  */
  /*
    Оформление вынесено в переменные: их задаёт блок `theme` в конфиге ролика.
    Ниже — значения по умолчанию (фирменный стиль IKIGAI PROMOTION). Всё, что
    здесь перечислено, человек меняет из конфига словами, не трогая шаблон.
    Геометрию (координаты, safe-zone, размер кадра) сюда НЕ выносим: она
    считается из base.mjs и произвольной правке не подлежит.
  */
  :root {
    --font: 'Inter','Segoe UI',Arial,sans-serif;  /* гарнитура всех надписей */
    --accent: #E5231B;              /* акцент: хук, подсветка слова, линейки */
    --card-bg: #F7F4EC;             /* фон титра-карточки */
    --card-text: #12100E;           /* заголовок карточки */
    --card-sub: #5A5652;            /* подзаголовок карточки */
    --cap-bg: #FFFFFF;              /* фон плашки субтитров */
    --cap-text: #12100E;            /* обычное слово в субтитрах */
    --hook-text: #FFFFFF;           /* текст хука на акцентной плашке */
    --frame-color: #FFFFFF;         /* рамка бокса спикера */
    --frame-width: 7px;             /* её толщина */
    --radius-card: 22px;            /* скругление карточки */
    --radius-cap: 20px;             /* скругление плашки субтитров */
    --radius-hook: 8px;             /* скругление хука */
    --case-head: uppercase;         /* регистр заголовков: uppercase | none */
    --shadow: 0 26px 60px rgba(0,0,0,.4);
    --scene-bg: rgba(10,9,8,.86);   /* фон полноэкранных кадров: финала и титра-перекрытия */
    --scene-text: #FFFFFF;          /* заголовок на этом фоне */
    --scene-sub: #D9D4CC;           /* подзаголовок на этом фоне */
    --scene-image: none;            /* картинка под этим фоном: url("file:///…") */

    /* Переопределения из конфига идут последними — иначе дефолты выше их затрут. */
    {{THEME_VARS}}
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  body { font-family:var(--font); -webkit-font-smoothing:antialiased; }
  #stage { position:absolute; inset:0; }

  /* ── Постоянные метки: прогресс ролика и бренд ── */
  #track { position:absolute; left:60px; top:126px; width:960px; height:6px;
           background:rgba(255,255,255,.28); border-radius:3px; overflow:hidden; }
  #bar { height:100%; width:0; background:var(--accent); }
  /* Плашка под брендом обязательна: белый текст на светлой стене не читался. */
  #brand { position:absolute; left:60px; top:146px; font-size:22px; font-weight:800;
           letter-spacing:3.5px; color:#FFFFFF; background:rgba(12,10,9,.55);
           padding:8px 14px; border-radius:6px; }

  /* ── Хук: первая плашка, обязана остановить скролл до первого слова ── */
  #hook { position:absolute; left:60px; right:150px; top:210px; opacity:0;
          background:var(--accent); color:var(--hook-text); padding:26px 34px; border-radius:var(--radius-hook);
          font-size:58px; font-weight:900; line-height:1.02; letter-spacing:-1.5px;
          text-transform:var(--case-head); box-shadow:0 18px 50px rgba(0,0,0,.4);
          will-change:transform,opacity; }

  /* ── Караоке: одна плашка с фразой, текущее слово подсвечено ── */
  #cap { position:absolute; left:60px; right:150px; opacity:0; display:flex; justify-content:center;
         will-change:transform,opacity; }
  #capBox { background:var(--cap-bg); border-radius:var(--radius-cap); padding:20px 26px; max-width:940px;
            box-shadow:0 14px 40px rgba(0,0,0,.32); text-align:center; }
  .wd { display:inline-block; font-size:52px; font-weight:800; color:var(--cap-text); line-height:1.12;
        letter-spacing:-1px; padding:2px 8px; border-radius:10px; }
  .wd.key { color:var(--accent); }
  .wd.now { background:var(--accent); color:#FFFFFF; }
  .wd.now.key { background:#12100E; color:#FFFFFF; }

  /* ── Рамка бокса спикера в боксовой сцене ── */
  #frame { position:absolute; opacity:0;
           box-shadow:0 0 0 var(--frame-width) var(--frame-color), 0 34px 70px rgba(0,0,0,.45); border-radius:2px; }

  /* ── Контент-зона под боксом: пруфы и титры ──
     Верх зоны заходит на нижний край бокса: наслоение читается как продуманная
     композиция, а идеально разложенные по сетке блоки — как шаблон. */
  .zone { position:absolute; left:60px; right:150px; top:1060px; height:340px; }

  /* Веер реальных работ: пруф обязан подтверждать сказанное, а не описывать его словами. */
  .fan { position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; }
  .fan img { width:290px; height:340px; object-fit:cover; border-radius:10px;
             box-shadow:0 20px 44px rgba(0,0,0,.42); border:6px solid var(--frame-color);
             margin:0 -18px; opacity:0; will-change:transform,opacity; }
  /* Подпись пруфа — акцентный шильдик под веером, в габаритах зоны: в прогоне v3 она
     висела ниже и её накрывала плашка субтитров. */
  /* nowrap здесь ломался: подпись длиннее веера вылезала за него и наезжала
     на снимки. Перенос по строкам, ширина ограничена шириной кадра. */
  .fanCap { position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
            font-size:26px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
            color:#FFFFFF; background:var(--accent); padding:7px 16px; border-radius:6px;
            max-width:86%; text-align:center; line-height:1.3; }

  /* Титр-карточка: кульминация фразы уходит в крупный текст, а не тонет в речи. */
  .card { position:absolute; left:0; right:0; top:20px; opacity:0; background:var(--card-bg);
          border-radius:var(--radius-card); padding:40px 44px; box-shadow:var(--shadow);
          will-change:transform,opacity; }
  .card h1 { font-size:92px; font-weight:900; color:var(--card-text); letter-spacing:-3px; line-height:.94;
             text-transform:var(--case-head); }
  .card .rule { height:9px; background:var(--accent); margin-top:22px; width:0; }
  .card .sub { font-size:32px; color:var(--card-sub); font-weight:600; margin-top:18px; }

  /* ── Полноэкранные кадры: финальный CTA и титр-перекрытие ──
     Оба закрывают кадр целиком и живут по одним правилам, поэтому и стили общие.
     Перекрытие — это кульминация фразы крупным текстом: спикера в этот момент не
     видно, и вся секунда работает на одну мысль. Приём взят из чужого завода,
     где смена композиции каждые 1.5–2 сек и есть та самая динамика.

     Фон кадра — два слоя: сверху заливка `--scene-bg`, под ней необязательная
     картинка `--scene-image`. Картинка одна на ролик и делается генератором
     заранее (одно изображение, не видео), поэтому стоит центы. Заливка при этом
     обязана стать прозрачнее — иначе картинки под ней не видно. */
  #cta, #takeover { position:absolute; inset:0; opacity:0;
         background-image: linear-gradient(var(--scene-bg), var(--scene-bg)), var(--scene-image);
         background-size: cover; background-position: center;
         display:flex; flex-direction:column; justify-content:center; padding:0 80px; }
  #cta h1, #takeover h1 { font-size:104px; font-weight:900; color:var(--scene-text);
            letter-spacing:-4px; line-height:.94; text-transform:var(--case-head); }
  #cta .rule, #takeover .rule { height:11px; background:var(--accent); margin:34px 0 30px; width:0; }
  #cta .sub, #takeover .sub { font-size:38px; color:var(--scene-sub); font-weight:600; line-height:1.3; }
  #cta .mark { position:absolute; left:80px; bottom:300px; font-size:26px; font-weight:800;
               letter-spacing:4px; color:var(--accent); }
  /* Заголовок перекрытия крупнее финального: это пик ролика, а не его хвост. */
  #takeover h1 { font-size:124px; }
  /* С экраном заголовок уступает место самому экрану и работает подписью к нему. */
  #takeover.has-screen h1 { font-size:84px; letter-spacing:-3px; }
  #takeover.has-screen .rule { margin:24px 0 22px; }

  /* ── Экран внутри перекрытия: терминал и мокап телефона ──
     Ответ на его «мокап-терминал». У него псевдокод в окне — абракадабра
     («imgert tlealire»), потому что кадр рисует модель. Здесь это вёрстка,
     поэтому текст настоящий и читается на любом стоп-кадре.
     Печать посимвольная и считается от времени кадра, а не от таймера:
     иначе рендер перестал бы быть воспроизводимым. */
  #tkScreen:empty { display:none; }
  #tkScreen { margin-bottom:26px; }

  .term { background:#0B0F14; border-radius:14px; border:1px solid rgba(255,255,255,.14);
          box-shadow:0 30px 70px rgba(0,0,0,.5); overflow:hidden; }
  .term .bar { display:flex; align-items:center; gap:10px; padding:16px 22px;
               background:rgba(255,255,255,.06); }
  .term .dot { width:14px; height:14px; border-radius:50%; background:#4A5361; }
  .term .name { margin-left:12px; font-size:22px; font-weight:700; letter-spacing:2.5px;
                color:#8296A8; text-transform:uppercase; }
  .term .body { padding:26px 28px; font-family:'Consolas','Courier New',monospace;
                font-size:34px; line-height:1.48; color:#D7E3EF; white-space:pre-wrap;
                word-break:break-word; }
  .term .ln.ok { color:#3DDC84; }
  .term .ln.pr { color:var(--accent); font-weight:700; }
  .term .caret { display:inline-block; width:16px; height:30px; background:var(--accent);
                 vertical-align:-3px; }

  .phone { width:620px; margin:0 auto; background:#0E1621; border-radius:46px;
           border:10px solid #33465C; box-shadow:0 34px 80px rgba(0,0,0,.55); overflow:hidden; }
  .phone .top { height:70px; display:flex; align-items:center; justify-content:center;
                background:#17212B; font-size:25px; font-weight:700; color:#F0F4F8;
                letter-spacing:.5px; }
  .phone .chat { padding:24px 20px; display:flex; flex-direction:column; gap:16px;
                 min-height:380px; }
  .bub { max-width:80%; padding:18px 22px; font-size:30px; line-height:1.24;
         border-radius:22px; will-change:transform,opacity; }
  .bub.in  { align-self:flex-start; background:#212D3B; color:#F0F4F8; border-bottom-left-radius:6px; }
  /* Исходящий пузырь — мессенджерный синий, а не акцент темы: на светлом акценте
     (циан «неон-теха», жёлтый «кинетика») белый текст пропадает. Мокап телефона
     всегда выглядит как ночной чат, тема в него не вмешивается. */
  .bub.out { align-self:flex-end;   background:#2B5278; color:#FFFFFF; border-bottom-right-radius:6px; }
</style>
</head>
<body>
<div id="stage">
  <div id="track"><div id="bar"></div></div>
  <div id="brand">{{BRAND}}</div>
  <div id="hook"></div>
  <div id="frame"></div>
  <div id="cap"><div id="capBox"></div></div>
  <div id="takeover"><h1></h1><div class="rule"></div><div id="tkScreen"></div><div class="sub"></div></div>
  <div id="cta"><h1></h1><div class="rule"></div><div class="sub"></div><div class="mark">{{BRAND}}</div></div>
</div>

<script>
  const FPS = {{FPS}};
  const ACCENT = "{{ACCENT}}";
  const DURATION = {{DURATION}};
  const BOX = {{BOX}};
  const PHRASES = {{PHRASES}};      // [{t0,t1,words:[{w,s,e,key}]}]
  const HOOK = {{HOOK}};            // {text,t1} | null
  const BOXES = {{BOXES}};          // [{t0,t1}] окна боксовых сцен — под ними рамка
  const PROOFS = {{PROOFS}};        // [{t0,t1,images:[src],caption}]
  const CARDS = {{CARDS}};          // [{t0,t1,title,sub}]
  const TAKEOVERS = {{TAKEOVERS}};  // [{t0,t1,title,sub}] полноэкранные титры без спикера
  const CTA = {{CTA}};              // {t0,title,sub} | null

  document.documentElement.style.setProperty('--accent', ACCENT);

  const stage = document.getElementById('stage');
  const capEl = document.getElementById('cap');
  const capBox = document.getElementById('capBox');
  const hookEl = document.getElementById('hook');
  const frameEl = document.getElementById('frame');
  const ctaEl = document.getElementById('cta');
  const takeoverEl = document.getElementById('takeover');
  const tkScreenEl = document.getElementById('tkScreen');

  if (HOOK) hookEl.textContent = HOOK.text;
  if (CTA) {
    ctaEl.querySelector('h1').textContent = CTA.title;
    ctaEl.querySelector('.sub').textContent = CTA.sub || '';
  }

  frameEl.style.left = BOX.x + 'px';
  frameEl.style.top = BOX.y + 'px';
  frameEl.style.width = BOX.w + 'px';
  frameEl.style.height = BOX.h + 'px';

  // Пруфы и титры живут в одной зоне под боксом. Элементы создаются один раз —
  // дальше кадр определяется только стилями, иначе рендер перестанет быть детерминированным.
  const proofEls = PROOFS.map((p) => {
    const zone = document.createElement('div');
    zone.className = 'zone';
    const fan = document.createElement('div');
    fan.className = 'fan';
    const imgs = p.images.map((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      // Небольшой разворот: веер снимков читается как физическая раскладка, не как грид.
      img.dataset.rot = String(-7 + i * 7);
      fan.appendChild(img);
      return img;
    });
    if (p.caption) {
      const cap = document.createElement('div');
      cap.className = 'fanCap';
      cap.textContent = p.caption;
      fan.appendChild(cap);
    }
    zone.appendChild(fan);
    stage.appendChild(zone);
    return { zone, imgs };
  });

  const cardEls = CARDS.map((c) => {
    const zone = document.createElement('div');
    zone.className = 'zone';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h1></h1><div class="rule"></div>' + (c.sub ? '<div class="sub"></div>' : '');
    card.querySelector('h1').textContent = c.title;
    if (c.sub) card.querySelector('.sub').textContent = c.sub;
    zone.appendChild(card);
    stage.appendChild(zone);
    return card;
  });

  const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
  const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const clamp01 = (x) => Math.min(1, Math.max(0, x));

  // ── Экран перекрытия: терминал и мокап телефона ──
  // Разметка собирается заново на каждом кадре — это допустимо ровно потому,
  // что она чистая функция от доли прошедшего времени: тот же кадр даёт ту же
  // строку. Текст приходит из конфига, поэтому экранируется.
  const esc = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function termHtml(scr, p) {
    const lines = scr.lines || [];
    const total = lines.reduce((s, l) => s + l.length, 0) || 1;
    // Печать заканчивается к 70% окна: остаток времени кадр стоит и читается.
    // Перекрытие живёт полторы-две секунды, дочитывать в движении нечего.
    const done = clamp01(p / 0.7);
    let left = Math.ceil(done * total);
    const rows = [];
    for (const line of lines) {
      const take = Math.max(0, Math.min(line.length, left));
      left -= take;
      // Класс по первому символу строки: ✓ — сделанное, $ или > — команда.
      const head = line.trim().charAt(0);
      const cls = head === '✓' ? ' ok' : (head === '$' || head === '>' ? ' pr' : '');
      rows.push('<div class="ln' + cls + '">' + esc(line.slice(0, take))
        + (take > 0 && take < line.length ? '<span class="caret"></span>' : '') + '</div>');
      if (left <= 0) break;
    }
    // Каретка после последней допечатанной строки: мигает, пока экран живёт.
    const blink = done >= 1 && Math.floor(p * 1000 / 260) % 2 === 0;
    if (blink) rows.push('<div class="ln"><span class="caret"></span></div>');
    return '<div class="term"><div class="bar">'
      + '<span class="dot"></span><span class="dot"></span><span class="dot"></span>'
      + (scr.title ? '<span class="name">' + esc(scr.title) + '</span>' : '')
      + '</div><div class="body">' + rows.join('') + '</div></div>';
  }

  function phoneHtml(scr, p) {
    const bubbles = scr.bubbles || [];
    const step = bubbles.length > 1 ? 0.62 / (bubbles.length - 1) : 0;
    const rows = bubbles.map((b, i) => {
      const k = clamp01((p - i * step) / 0.16);
      if (k <= 0) return '';
      const style = 'opacity:' + k.toFixed(3)
        + ';transform:translateY(' + (22 * (1 - easeOutCubic(k))).toFixed(1) + 'px) '
        + 'scale(' + (0.94 + 0.06 * easeOutCubic(k)).toFixed(3) + ')';
      return '<div class="bub ' + (b.side === 'out' ? 'out' : 'in') + '" style="' + style + '">'
        + esc(b.text) + '</div>';
    });
    return '<div class="phone">'
      + (scr.title ? '<div class="top">' + esc(scr.title) + '</div>' : '')
      + '<div class="chat">' + rows.join('') + '</div></div>';
  }

  // Единственная точка истины по кадру: Playwright дёргает её перед каждым скриншотом.
  window._seekFrame = function (n) {
    const t = n / FPS;

    document.getElementById('bar').style.width = (100 * clamp01(t / DURATION)) + '%';

    // ── хук ──
    if (HOOK) {
      // Начинаем не с нуля: первый кадр ролика — это превью в ленте, и при
      // прозрачности 0 он уходил в ленту без хука, с одной плашкой бренда.
      // Влёт сохраняем, но через сдвиг, а не через долгое проявление.
      const k = clamp01(0.6 + t / 0.12);
      const out = t > HOOK.t1 - 0.25 ? clamp01((t - (HOOK.t1 - 0.25)) / 0.25) : 0;
      hookEl.style.opacity = t > HOOK.t1 ? '0' : String((1 - out) * k);
      hookEl.style.transform = 'translateY(' + (-40 * (1 - easeOutBack(k)) - 30 * out) + 'px)';
    }

    // ── боксовая сцена: рамка ──
    const box = BOXES.find((b) => t >= b.t0 && t <= b.t1);
    const inBox = Boolean(box);
    // В боксовой сцене штамп бренда пришёлся бы на саму картинку и читался бы как
    // водяной знак — на это время он уходит, бренд несут рамка, шильдик пруфа и финал.
    document.getElementById('brand').style.opacity = inBox ? '0' : '1';
    if (box) {
      const k = clamp01((t - box.t0) / 0.25);
      const out = t > box.t1 - 0.2 ? clamp01((t - (box.t1 - 0.2)) / 0.2) : 0;
      frameEl.style.opacity = String((1 - out) * k);
    } else {
      frameEl.style.opacity = '0';
    }

    // ── пруфы: снимки въезжают по очереди ──
    PROOFS.forEach((p, i) => {
      const { zone, imgs } = proofEls[i];
      const on = t >= p.t0 && t <= p.t1;
      zone.style.opacity = on ? '1' : '0';
      if (!on) return;
      imgs.forEach((img, k) => {
        const kk = clamp01((t - p.t0 - k * 0.11) / 0.34);
        const outK = t > p.t1 - 0.22 ? clamp01((t - (p.t1 - 0.22)) / 0.22) : 0;
        img.style.opacity = String((1 - outK) * kk);
        img.style.transform = 'translateY(' + (70 * (1 - easeOutCubic(kk))) + 'px) '
          + 'rotate(' + (Number(img.dataset.rot) * easeOutCubic(kk)) + 'deg) '
          + 'scale(' + (0.9 + 0.1 * easeOutCubic(kk)) + ')';
      });
    });

    // ── титры-карточки ──
    CARDS.forEach((c, i) => {
      const el = cardEls[i];
      if (t < c.t0 || t > c.t1) { el.style.opacity = '0'; return; }
      const k = clamp01((t - c.t0) / 0.32);
      const out = t > c.t1 - 0.24 ? clamp01((t - (c.t1 - 0.24)) / 0.24) : 0;
      el.style.opacity = String((1 - out) * Math.min(1, k * 1.4));
      el.style.transform = 'translateY(' + (56 * (1 - easeOutCubic(k)) - 34 * out) + 'px)';
      const rule = el.querySelector('.rule');
      if (rule) rule.style.width = Math.round(100 * easeOutCubic(k)) + '%';
    });

    // ── караоке ──
    const ctaOn = CTA && t >= CTA.t0;
    const hookOn = HOOK && t < HOOK.t1;
    // Титр-карточка глушит субтитр так же, как хук и финал. Карточка ставится на
    // кульминацию фразы и несёт тот же смысл крупным текстом — показывать оба разом
    // значит написать одно и то же дважды, друг на друга. Поймано публикацией 30.07:
    // после подъёма субтитров из зоны ника они наехали на карточку.
    const cardOn = CARDS.some((c) => t >= c.t0 && t < c.t1);
    // Пруф глушит субтитр по той же причине, что и карточка. Поймано боевой
    // выкладкой 31.07: веер снимков, подпись пруфа и строка субтитров встали
    // стопкой вплотную — три текстовых слоя подряд, глазу не за что зацепиться.
    // На мониторе читалось как «тесновато», в ленте как каша. Снимки в этот
    // момент говорят сами, а речь уже продублирована подписью пруфа.
    const proofOn = PROOFS.some((p) => t >= p.t0 && t < p.t1);
    // Титр-перекрытие закрывает кадр целиком — под ним субтитру просто нет места.
    const takeoverOn = TAKEOVERS.some((o) => t >= o.t0 && t < o.t1);
    const ph = (ctaOn || hookOn || cardOn || proofOn || takeoverOn) ? null : PHRASES.find((p) => t >= p.t0 && t < p.t1 + 0.12);
    if (ph) {
      capBox.innerHTML = ph.words.map((w) => {
        // Предлоги и союзы подсветку не получают. В ленте это читалось как
        // артефакт: отдельный цветной квадратик с одной буквой «в» у края
        // плашки. Подсветка ведёт взгляд по смыслу, а на «в» вести нечего —
        // доля секунды без активного слова глазом не замечается.
        const now = t >= w.s && t < w.e && w.w.length > 2;
        return '<span class="wd' + (w.key ? ' key' : '') + (now ? ' now' : '') + '">' + w.w + '</span>';
      }).join(' ');
      // В боксовой сцене плашка садится в самый низ: контент-зона занята пруфом.
      capEl.style.bottom = 440 + 'px';
      const k = clamp01((t - ph.t0) / 0.18);
      capEl.style.opacity = String(Math.min(1, k * 1.8));
      capEl.style.transform = 'scale(' + (0.9 + 0.1 * easeOutBack(k)) + ')';
    } else {
      capEl.style.opacity = '0';
    }

    // ── титр-перекрытие ──
    // Вход резче финала (0.18 против 0.28): перекрытие живёт полторы-две секунды,
    // и мягкое проявление съело бы половину этого времени.
    const over = TAKEOVERS.find((o) => t >= o.t0 - 0.18 && t <= o.t1 + 0.2);
    if (over) {
      takeoverEl.querySelector('h1').textContent = over.title;
      takeoverEl.querySelector('.sub').textContent = over.sub || '';
      // Экран (терминал или телефон) — доля прошедшего времени окна, не абсолютные секунды:
      // перекрытие держится ровно столько, сколько длится фраза, и печать обязана
      // укладываться в него на любой длине.
      takeoverEl.classList.toggle('has-screen', Boolean(over.screen));
      if (over.screen) {
        const p = clamp01((t - over.t0) / Math.max(0.3, over.t1 - over.t0));
        tkScreenEl.innerHTML = over.screen.kind === 'phone'
          ? phoneHtml(over.screen, p)
          : termHtml(over.screen, p);
      } else if (tkScreenEl.innerHTML) {
        tkScreenEl.innerHTML = '';
      }
      const k = clamp01((t - over.t0) / 0.18);
      const out = t > over.t1 - 0.2 ? clamp01((t - (over.t1 - 0.2)) / 0.2) : 0;
      takeoverEl.style.opacity = String(Math.max(0, (1 - out) * k));
      const rule = takeoverEl.querySelector('.rule');
      if (rule) rule.style.width = Math.round(70 * easeOutCubic(k)) + '%';
    } else {
      takeoverEl.style.opacity = '0';
    }

    // ── финальный кадр ──
    if (CTA) {
      const k = clamp01((t - CTA.t0) / 0.28);
      ctaEl.style.opacity = t < CTA.t0 ? '0' : String(k);
      const rule = ctaEl.querySelector('.rule');
      if (rule) rule.style.width = Math.round(70 * easeOutCubic(k)) + '%';
    }
  };

  window._seekFrame(0);
</script>
</body>
</html>
